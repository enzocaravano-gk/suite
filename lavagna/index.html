<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    /* stesso stile di Report gara e Posizionamenti: colore squadra scelto dal menu ☰ */
    --accent:#8B0000; --accent-dark:#600000; --accent-rgb:139, 0, 0; --accent2:var(--accent-dark);
    --bg:#f4f4f4; --panel:#ffffff; --line:#e0e0e0; --ink:#1a1a1a;
    --muted:#6a6a6a; --danger:#d64545;
    --field-maxh:min(80vh,760px); --barh:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{display:block;padding:20px}
  .app{max-width:1400px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.12);border:1px solid #e0e0e0;padding:26px 30px 32px}

  /* ---- Riga logo + menu ☰ (come Report gara / Posizionamenti) ---- */
  .logo-row{display:flex;align-items:center;gap:20px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--accent);flex-wrap:wrap}
  .logo-box{display:flex;align-items:center;gap:18px;flex:1 1 200px}
  .logo-box img{max-height:80px;max-width:160px;object-fit:contain;border:2px solid #e0e0e0;border-radius:12px;padding:6px;background:#fff}
  .logo-box img:not([src]),.logo-box img[src=""]{display:none}
  .logo-placeholder{font-size:13px;color:#888}
  .hamburger-wrap{position:relative}
  .hamburger-btn{background:transparent;border:none;font-size:28px;cursor:pointer;padding:6px 10px;color:var(--accent);line-height:1}
  .hamburger-dropdown{position:absolute;top:100%;right:0;background:#fff;border:1.5px solid var(--accent);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:16px 20px;min-width:240px;display:none;z-index:100;margin-top:8px}
  .hamburger-dropdown.open{display:block}
  .menu-item{padding:8px 0;border-bottom:1px solid #f0f0f0}
  .menu-item:last-child{border-bottom:none}
  .menu-label{display:block;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.3px;margin-bottom:6px}
  .logo-upload input[type="file"]{font-size:13px;padding:6px 8px;border:1.5px dashed var(--accent);border-radius:10px;background:#fcfcfc;width:100%}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;font-family:inherit}
  .coach-name{display:block;font-size:13px;color:#555;margin-bottom:4px;word-break:break-word}
  .coach-name:empty{display:none}
  .color-swatches{display:flex;gap:9px;flex-wrap:wrap}
  .color-swatch{width:26px;height:26px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px #d0d0d0;cursor:pointer;transition:.15s;padding:0}
  .color-swatch:hover{transform:scale(1.12)}
  .color-swatch.selected{box-shadow:0 0 0 1.5px #fff,0 0 0 3.5px var(--accent)}
  .print-sign{display:none}

  /* ---- Header / anagrafica ---- */
  header{background:transparent;padding:0 0 22px}
  .head-top{display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:3px solid var(--accent);padding-bottom:14px;flex-wrap:wrap}
  .head-top h1{font-size:28px;margin:0;font-weight:700}
  .head-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  button.btn{border:1.5px solid var(--accent);background:#fff;color:var(--accent);padding:9px 20px;border-radius:40px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;transition:.2s}
  button.btn:hover{background:rgba(var(--accent-rgb),.06)}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(var(--accent-rgb),.35)}
  button.btn.primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
  button.btn.ghost{background:transparent}
  .anag{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 22px}
  .anag label{display:flex;flex-direction:column;font-size:13px;color:var(--accent);font-weight:600;gap:4px;text-transform:uppercase;letter-spacing:.4px}
  .anag input{border:1.5px solid #d0d0d0;border-radius:12px;padding:10px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fafafa;min-height:44px;text-transform:none;letter-spacing:normal;font-weight:400;width:100%}
  .anag input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);background:#fff}
  .anag .wide{grid-column:span 2}

  /* ---- Toolbar disegno (sticky) ---- */
  .drawbar{position:sticky;top:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .drawbar .grp{display:flex;gap:4px;align-items:center}
  .drawbar .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
  .mode{border:1.5px solid #d0d0d0;background:#fff;border-radius:40px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;font-family:inherit;color:var(--ink)}
  .mode:hover{background:rgba(var(--accent-rgb),.06);border-color:var(--accent)}
  .mode.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .mode .sw{width:22px;height:0;border-top-width:3px;border-top-style:solid;display:inline-block}
  .drawbar .lbl{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-right:2px}

  /* ---- Main ---- */
  main{display:flex;align-items:flex-start}
  .palette{width:132px;background:var(--panel);border-right:1px solid var(--line);border-radius:0 0 0 14px;overflow-y:auto;padding:8px;position:sticky;top:var(--barh,0px);height:calc(100vh - var(--barh,0px));align-self:flex-start;z-index:20}
  .palette h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin:12px 4px 6px;font-weight:700}
  .palette h3:first-child{margin-top:2px}
  .pal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .pal-item{background:#fafafa;border:1.5px solid #e6e6e6;border-radius:10px;padding:5px;cursor:grab;display:flex;align-items:center;justify-content:center;height:52px;box-sizing:border-box;min-width:0;overflow:hidden}
  .pal-item:hover{border-color:var(--accent)}
  .pal-item:active{cursor:grabbing}
  /* Safari/iPad: max-height in % dentro un flex non è affidabile -> dimensioni esplicite + object-fit */
  .pal-item img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;pointer-events:none;-webkit-user-drag:none}

  .content{flex:1;min-width:0;overflow:visible;padding:16px 0 0 18px;display:flex;flex-direction:column;gap:16px}

  /* ---- Blocco esercitazione ---- */
  .exercise{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.05);overflow:hidden;break-inside:avoid}
  .exercise.collapsed .ex-body{display:none}
  .exercise.collapsed .ex-head{border-bottom:none}
  .exercise.collapsed select.pitch{display:none}
  .ex-btns button[data-a="toggle"]{font-size:11px}
  .exercise.collapsed .ex-btns button[data-a="toggle"]::before{content:"▸"}
  .ex-btns button[data-a="toggle"]::before{content:"▾"}
  .ex-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(var(--accent-rgb),.05);border-bottom:2px solid var(--accent)}
  .ex-badge{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ex-head input.title{flex:1;border:1px solid transparent;background:transparent;font-size:15px;font-weight:700;padding:5px 6px;border-radius:6px;font-family:inherit;color:var(--ink);min-width:60px}
  .ex-head input.title:focus{background:#fff;border-color:var(--line);outline:none}
  .ex-head input.dur{width:74px;border:1.5px solid #d0d0d0;border-radius:10px;background:#fff;padding:5px 6px;font-size:12.5px;font-family:inherit}
  .ex-head select.pitch{border:1.5px solid #d0d0d0;border-radius:10px;padding:5px 6px;font-size:12.5px;font-family:inherit;background:#fff;cursor:pointer;color:var(--ink)}
  .ex-head .ex-btns{display:flex;gap:4px}
  .ex-head .ex-btns button{width:30px;height:30px;border:1.5px solid #d0d0d0;background:#fff;border-radius:50%;color:var(--accent);cursor:pointer;font-size:13px;line-height:1}
  .ex-head .ex-btns button:hover{background:rgba(var(--accent-rgb),.08);border-color:var(--accent)}
  .ex-head .ex-btns button.del:hover{background:#fde8e8;border-color:var(--danger);color:var(--danger)}
  .ex-body{display:flex;gap:10px;padding:10px;align-items:stretch}
  .field-box{flex:1;min-width:0}
  .field{position:relative;--arw:1050;--arh:680;width:min(100%, calc(var(--field-maxh) * var(--arw) / var(--arh)));aspect-ratio:var(--arw) / var(--arh);margin:0 auto;border-radius:10px;overflow:hidden;background:#2f9e4f;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);container-type:inline-size}
  .field svg.pitch,.field svg.draw{position:absolute;inset:0;width:100%;height:100%}
  /* iPad/iPhone: tocchi ravvicinati (es. +/- ripetuti) non devono attivare lo zoom a doppio tocco; il pinch resta attivo */
  html,body,button,.pal-item,.float-el,.drawbar{touch-action:manipulation}
  .field svg.draw{touch-action:none}
  .drop-el{position:absolute;cursor:grab;user-select:none;touch-action:none;z-index:5}
  .drop-el:active{cursor:grabbing}
  .drop-el img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .drop-el.sel{outline:2px dashed #fff;outline-offset:2px}
  .drop-el.text{display:flex}
  .drop-el.text .txt{background:rgba(255,255,255,.85);border-radius:6px;padding:2px 7px;font-weight:600;line-height:1.2;white-space:pre;font-family:inherit;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.3);transform-origin:center;min-width:8px}
  .drop-el.text .txt:empty::before{content:'Testo…';color:#9aa3ab}
  .drop-el .handle,.drop-el .rot{position:absolute;width:15px;height:15px;background:#fff;border:2px solid var(--accent);border-radius:50%;display:none}
  .drop-el .handle{right:-8px;bottom:-8px;cursor:nwse-resize}
  .drop-el .rot{left:50%;top:-20px;transform:translateX(-50%);cursor:grab}
  .drop-el.sel .handle,.drop-el.sel .rot{display:block}
  .draw-g.sel path.vis{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff)}
  .line-handle{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.4);z-index:20;cursor:grab;touch-action:none}
  .line-handle:active{cursor:grabbing}
  .line-handle.lh-m{border-radius:4px;transform:rotate(45deg);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;background:var(--accent);border-color:#fff}
  @media (pointer:coarse){.line-handle{width:26px;height:26px;margin:-13px 0 0 -13px}.line-handle.lh-m{width:21px;height:21px;margin:-10.5px 0 0 -10.5px}}

  .notes{width:280px;flex:0 0 280px;display:flex;flex-direction:column}
  .notes label{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .notes textarea{flex:1;min-height:120px;border:1.5px solid #d0d0d0;border-radius:12px;background:#fafafa;padding:10px;font-size:13px;font-family:inherit;resize:none;line-height:1.5;text-align:justify}
  .notes-print{display:none}

  .notes textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);background:#fff}
  .add-ex{align-self:flex-start;border:1.5px dashed var(--accent);color:var(--accent);background:#fff;padding:12px 24px;border-radius:40px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
  .add-ex:hover{background:rgba(var(--accent-rgb),.06)}
  .add-row{display:flex;gap:10px;flex-wrap:wrap}
  /* ---- Esercizio solo testo: niente campo, descrizione a tutta larghezza ---- */
  .notes .mat-row{display:none;margin-bottom:10px}
  .notes .mat-row input{width:100%;border:1.5px solid #d0d0d0;border-radius:12px;background:#fafafa;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--ink);margin-top:4px}
  .notes .mat-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);background:#fff}
  .exercise.text-only .field-box{display:none}
  .exercise.text-only .notes{width:100%;flex:1 1 auto}
  .exercise.text-only .notes .mat-row{display:block}
  .exercise.text-only .notes textarea{min-height:240px}
  .text-print{display:none}

  /* toolbar elemento fluttuante */
  .float-el{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--accent);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px;display:none;gap:6px;z-index:40}
  .float-el button{width:34px;height:34px;border:1.5px solid #d0d0d0;background:#fff;border-radius:10px;cursor:pointer;font-size:15px}
  .float-el button:hover{background:rgba(var(--accent-rgb),.06);border-color:var(--accent)}
  .float-el button.del:hover{background:#fde8e8;border-color:var(--danger);color:var(--danger)}
  .float-el .only-line{display:none}
  .zi{display:inline-block;width:15px;height:11px;border:2px dashed #111;background:rgba(0,0,0,.12);vertical-align:-1px;margin-right:2px}
  .float-el.line-mode .only-line{display:inline-flex;align-items:center;justify-content:center}
  .float-el .fe-sep{width:1px;background:var(--line);margin:4px 2px;align-self:stretch}
  .float-el button.lt{padding:0}
  .float-el .only-zone{display:none}
  .float-el.zone-mode .only-zone{display:inline-flex;align-items:center;justify-content:center}
  .float-el.zone-mode .no-zone{display:none}
  .float-el button.lt.on{background:rgba(var(--accent-rgb),.12);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .float-el{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}

  /* ---- Responsive: tablet / mobile ---- */
  @media screen and (max-width:820px){
    :root{--field-maxh:min(70vh,560px)}
    /* la pagina scorre in modo naturale (niente scroller interni che tagliano) */
    html,body{height:auto;min-height:100%}
    body{display:block}
    main{display:block}
    .content{overflow:visible;flex:none}
    .drawbar{position:static}
    /* palette come striscia orizzontale scorrevole in alto */
    .palette{position:static;top:auto;width:100%;height:auto;max-height:none;border-right:none;border-bottom:1px solid var(--line);
      display:flex;flex-direction:row;align-items:stretch;gap:10px;padding:8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
    .palette h3{margin:0;padding:0;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;font-size:9px;flex:0 0 auto;white-space:nowrap}
    .pal-grid{grid-auto-flow:column;grid-template-columns:none;grid-template-rows:50px 50px;grid-auto-columns:50px;flex:0 0 auto}
    .pal-item{height:50px}
    .pal-grid>[style*="span 2"]{grid-column:auto!important;grid-row:span 2;flex-direction:column}
    .content{padding:10px;gap:12px}
    .ex-body{flex-direction:column}
    .field-box{width:100%}
    .notes{width:100%;flex:1 1 auto}
    .notes textarea{min-height:120px}
    .ex-head{flex-wrap:wrap}
    .ex-head input.title{flex:1 1 100%;order:-1}
    .drawbar{gap:5px}
    .drawbar .grp{flex-wrap:wrap}
    header{padding:0 0 16px}
    body{padding:8px}
    .app{padding:16px 14px 22px;border-radius:20px}
    .head-top h1{font-size:22px}
    .content{padding:12px 0 0}
    .palette{border-radius:0}
  }
  @media screen and (max-width:480px){
    .head-top h1{font-size:20px}
    .anag .wide{grid-column:auto}
    button.btn{padding:8px 14px;font-size:13px}
    .float-el button{width:38px;height:38px}
    .pal-grid{grid-template-rows:46px 46px;grid-auto-columns:46px}
    .pal-item{height:46px}
  }

  @media print{
    body{background:#fff;padding:0}
    .app{max-width:none;border:none;box-shadow:none;border-radius:0;padding:0}
    .hamburger-wrap,.logo-placeholder{display:none!important}
    .logo-row{margin-bottom:10px;padding-bottom:8px}
    .logo-box img{max-height:60px;border:none;padding:0}
    .anag input{background:#fff;min-height:0;padding:5px 8px;font-size:13px}
    .exercise{box-shadow:none!important}
    /* firma dell'allenatore: piccola e grigio chiaro in fondo a ogni pagina */
    .print-sign:not(:empty){display:block!important;position:fixed;right:6mm;bottom:2mm;font-size:9px;color:#b0b0b0;letter-spacing:.3px}
    .palette,.head-actions,.drawbar,.float-el,.add-ex,.add-row,.ex-btns{display:none!important}
    main{display:block;overflow:visible}
    .content{overflow:visible;padding:0}
    header{border:none}
    .exercise{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px;box-shadow:none}
    /* in stampa mostra SEMPRE tutte le esercitazioni, anche quelle compresse */
    .exercise.collapsed .ex-body{display:block!important}
    .exercise.collapsed .ex-head{border-bottom:1px solid var(--line)!important}
    .exercise.collapsed select.pitch{display:inline-block}
    /* stampa: campo centrato e note SOTTO a tutta larghezza (layout omogeneo, note lunghe che scorrono in pagina) */
    .ex-body{display:block!important;padding:10px!important}
    .field-box{width:auto!important}
    .field{width:128mm!important;height:calc(128mm * var(--arh) / var(--arw))!important;aspect-ratio:auto!important;max-width:100%!important;min-width:0!important;margin:0 auto!important}
    .notes{width:100%!important;flex:none!important;margin-top:10px}
    .notes textarea{display:none!important}
    .exercise.text-only .ex-body{padding:12px 14px!important}
    .exercise.text-only .notes{margin-top:0}
    .exercise.text-only .notes>label,.exercise.text-only .mat-row,.exercise.text-only .notes-print{display:none!important}
    .exercise.text-only .text-print{display:block!important;border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;background:#fff}
    .text-print .tp-meta{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .text-print .tp-meta:empty{display:none}
    .text-print .tp-meta b{color:var(--accent);text-transform:uppercase;letter-spacing:.4px;font-size:11px;margin-right:4px}
    .text-print .tp-txt{white-space:pre-wrap;overflow-wrap:break-word;font-size:13.5px;line-height:1.6;color:var(--ink);min-height:60px}
    .notes-print{display:block!important;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;font-size:13px;line-height:1.5;padding:2px 0;color:var(--ink);text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
    .drop-el.sel{outline:none}
    .drop-el .handle,.drop-el .rot,.line-handle{display:none!important}
    .draw-g.sel path.vis{filter:none!important}
  }
</style>
</head>
<body>
<div class="app">
<!-- LOGO + MENU (come Report gara / Posizionamenti) -->
<div class="logo-row">
  <div class="logo-box">
    <img id="clubLogo" alt="Logo società">
    <span class="logo-placeholder" id="logoPlaceholder">(logo non caricato)</span>
  </div>
  <div class="hamburger-wrap">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">☰</button>
    <div class="hamburger-dropdown" id="hamburgerDropdown">
      <div class="menu-item logo-upload">
        <label class="menu-label" for="logoUpload">⬆️ Carica logo</label>
        <input type="file" id="logoUpload" accept="image/*">
        <button type="button" class="link-btn" id="removeLogoBtn" style="margin-top:8px">✕ Rimuovi logo</button>
      </div>
      <div class="menu-item">
        <span class="menu-label">✍️ Firma allenatore</span>
        <span class="coach-name" id="coachNameLbl"></span>
        <button type="button" class="link-btn" id="coachBtn">Aggiungi nome allenatore</button>
      </div>
      <div class="menu-item">
        <span class="menu-label">🎨 Colore squadra</span>
        <div class="color-swatches">
          <button type="button" class="color-swatch selected" data-accent="#8B0000" data-accent-dark="#600000" data-accent-rgb="139, 0, 0" style="background:#8B0000" title="Granata"></button>
          <button type="button" class="color-swatch" data-accent="#1652a1" data-accent-dark="#0f3b73" data-accent-rgb="22, 82, 161" style="background:#1652a1" title="Blu"></button>
          <button type="button" class="color-swatch" data-accent="#d32f2f" data-accent-dark="#a02323" data-accent-rgb="211, 47, 47" style="background:#d32f2f" title="Rosso"></button>
          <button type="button" class="color-swatch" data-accent="#1e8449" data-accent-dark="#14602f" data-accent-rgb="30, 132, 73" style="background:#1e8449" title="Verde"></button>
          <button type="button" class="color-swatch" data-accent="#0288d1" data-accent-dark="#01579b" data-accent-rgb="2, 136, 209" style="background:#0288d1" title="Azzurro"></button>
          <button type="button" class="color-swatch" data-accent="#6a3fa0" data-accent-dark="#4d2d75" data-accent-rgb="106, 63, 160" style="background:#6a3fa0" title="Viola"></button>
          <button type="button" class="color-swatch" data-accent="#222222" data-accent-dark="#000000" data-accent-rgb="34, 34, 34" style="background:#222" title="Nero"></button>
        </div>
      </div>
    </div>
  </div>
</div>
<header>
  <div class="head-top">
    <h1>Creatore Esercitazioni</h1>
    <div class="head-actions">
      <button class="btn" id="btnSave" title="Salva la seduta come file sul dispositivo">💾 Salva</button>
      <button class="btn" id="btnLoad" title="Apri una seduta salvata dal dispositivo">📂 Carica</button>
      <button class="btn primary" id="btnPrint">🖨 Stampa / PDF</button>
    </div>
  </div>
  <div class="anag">
    <label>Data<input type="date" id="f_data"></label>
    <label>Categoria / Squadra<input id="f_cat" placeholder="Es. Under 15"></label>
    <label>Seduta n°<input id="f_num" placeholder="Es. 12"></label>
    <label>Durata totale<input id="f_dur" placeholder="Es. 90'"></label>
    <label class="wide">Obiettivo della seduta<input id="f_obj" placeholder="Es. Trasmissione palla / smarcamento"></label>
    <label>N° giocatori<input id="f_ngioc" placeholder="Es. 14"></label>
    <label class="wide">Materiale<input id="f_mat" placeholder="Es. 8 coni, 6 casacche, 4 palloni"></label>
  </div>
</header>

<div class="drawbar">
  <span class="lbl">Colore</span>
  <input type="color" id="drawColor" value="#111111" title="Colore: si applica alla nuova linea e all'elemento selezionato (linea, cono/cinesino/cerchio, testo)" style="width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer">
  <span class="sep"></span>
  <span class="lbl">Strumento</span>
  <div class="grp">
    <button class="mode active" data-mode="select">▣ Sposta</button>
    <button class="mode" data-mode="pass"><span class="sw" style="border-top-color:#111;border-top-style:solid"></span> Passaggio</button>
    <button class="mode" data-mode="corsa"><span class="sw" style="border-top-color:#111;border-top-style:dashed"></span> Corsa</button>
    <button class="mode" data-mode="cond"><span class="sw" style="border-top-color:#111;border-top-style:solid"></span>〜 Conduzione</button>
    <button class="mode" data-mode="tiro"><span class="sw" style="border-top-color:#d64545;border-top-width:5px"></span> Tiro</button>
    <button class="mode" data-mode="linea" title="Linea continua senza freccia (delimita zone)"><span class="sw" style="border-top-color:#111;border-top-style:solid"></span> Linea</button>
    <button class="mode" data-mode="lineatr" title="Linea tratteggiata senza freccia (delimita zone)"><span class="sw" style="border-top-color:#111;border-top-style:dashed"></span> Linea tratt.</button>
    <button class="mode" data-mode="zrett" title="Zona rettangolare: trascina da un angolo all'altro"><span class="zi" style="border-radius:2px"></span> Zona</button>
    <button class="mode" data-mode="zcerchio" title="Zona circolare/ovale: trascina per disegnarla"><span class="zi" style="border-radius:50%"></span> Zona</button>
    <button class="mode" data-mode="gomma">🩹 Gomma</button>
  </div>
</div>

<main>
  <aside class="palette" id="palette"></aside>
  <div class="content" id="content">
    <div class="add-row" id="addRow">
      <button class="add-ex" id="btnAddEx">＋ Aggiungi esercitazione</button>
      <button class="add-ex" id="btnAddTxt" title="Esercizio scritto, senza disegnare sul campo">📝 Aggiungi esercizio solo testo</button>
    </div>
  </div>
</main>
</div>
<div class="print-sign" id="printSign"></div>

<div class="float-el" id="floatEl">

const KIT_FILES=new Set(["kit frontale.png","kit spalle.png","kit corsa.png","kit corsa spalle.png"]);
const kitCache={}, kitBase={};
function kitLoad(file){
  if(kitBase[file]) return kitBase[file];
  return kitBase[file]=new Promise(res=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
    const x=c.getContext('2d');x.drawImage(im,0,0);const data=x.getImageData(0,0,c.width,c.height);
    const d=data.data,mask=new Uint8Array(d.length/4),vals=[];
    for(let i=0,p=0;i<d.length;i+=4,p++){
      if(d[i+3]===0) continue;
      const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),ch=mx-mn;
      if(ch<1e-6||mx<=0.12||ch/mx<=0.35) continue;
      let h= mx===r?((g-b)/ch+6)%6 : mx===g?(b-r)/ch+2 : (r-g)/ch+4; h*=60;
      if(h>=315||h<=6){mask[p]=1;vals.push(mx);}
    }
    vals.sort((a,b)=>a-b);
    res({c,data,mask,ref:vals[vals.length>>1]||0.44});};im.src=IMG[file]||file;});
}
function kitURI(file,color){
  const key=file+'@'+color;
  if(kitCache[key]) return Promise.resolve(kitCache[key]);
  return kitLoad(file).then(({c,data,mask,ref})=>{
    const h=color.replace('#',''),T=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
    const out=new ImageData(new Uint8ClampedArray(data.data),data.width,data.height),d=out.data;
    for(let p=0,i=0;p<mask.length;p++,i+=4){ if(!mask[p]) continue;
      const k=Math.max(d[i],d[i+1],d[i+2])/255/ref;
      for(let j=0;j<3;j++) d[i+j]= k<=1 ? T[j]*k : T[j]+(255-T[j])*Math.min(1,k-1);
    }
    const cv=document.createElement('canvas');cv.width=out.width;cv.height=out.height;cv.getContext('2d').putImageData(out,0,0);
    return kitCache[key]=cv.toDataURL('image/png');
  });
}

const LINE_TYPES=['pass','corsa','cond','tiro','linea','lineatr'];

const sameFamily=(a,b)=>(LINE_TYPES.includes(a)&&LINE_TYPES.includes(b))||(isZone(a)&&isZone(b));

/* ---- Definizione stili linee ---- */
function lineStyle(t,color){
  switch(t){
    case 'pass': return {stroke:color,width:3,dash:'',wavy:false,head:true};
    case 'corsa':return {stroke:color,width:3,dash:'9,7',wavy:false,head:true};
    case 'cond': return {stroke:color,width:3,dash:'',wavy:true,head:true};
    case 'tiro': return {stroke:color||'#d64545',width:5,dash:'',wavy:false,head:true};
    case 'linea':   return {stroke:color,width:3,dash:'',wavy:false,head:false};
    case 'lineatr': return {stroke:color,width:3,dash:'10,7',wavy:false,head:false};
    default:     return {stroke:color,width:3,dash:'',wavy:false,head:true};
  }
}
/* --- geometria linee: retta o curva (bezier quadratica con punto di controllo cx,cy) --- */
function hasCurve(o){return o.cx!=null&&o.cx!==''&&!isNaN(+o.cx);}
function ctrlOf(o){return hasCurve(o)?{x:+o.cx,y:+o.cy}:{x:(o.x1+o.x2)/2,y:(o.y1+o.y2)/2};}
function qPt(o,c,t){const u=1-t;return{x:u*u*o.x1+2*u*t*c.x+t*t*o.x2,y:u*u*o.y1+2*u*t*c.y+t*t*o.y2};}
function qTan(o,c,t){return{x:2*(1-t)*(c.x-o.x1)+2*t*(o.x2-c.x),y:2*(1-t)*(c.y-o.y1)+2*t*(o.y2-c.y)};}
function basePathD(o){const c=ctrlOf(o);return hasCurve(o)?`M ${o.x1} ${o.y1} Q ${c.x} ${c.y} ${o.x2} ${o.y2}`:`M ${o.x1} ${o.y1} L ${o.x2} ${o.y2}`;}
function wavyD(o){
  const c=ctrlOf(o);let len=0,prev=qPt(o,c,0);
  for(let i=1;i<=40;i++){const p=qPt(o,c,i/40);len+=Math.hypot(p.x-prev.x,p.y-prev.y);prev=p;}
  const amp=7,waves=Math.max(1,Math.round(len/26)),n=waves*8;
  let d=`M ${o.x1.toFixed(1)} ${o.y1.toFixed(1)}`;
  for(let i=1;i<=n;i++){const t=i/n,p=qPt(o,c,t),tg=qTan(o,c,t),tl=Math.hypot(tg.x,tg.y)||1;
    const off=Math.sin(t*Math.PI*waves*2)*amp*(i<n?1:0.15);
    d+=` L ${(p.x-tg.y/tl*off).toFixed(1)} ${(p.y+tg.x/tl*off).toFixed(1)}`;}
  return d;
}
function buildDraw(o){
  o={...o,x1:+o.x1,y1:+o.y1,x2:+o.x2,y2:+o.y2};
  if(hasCurve(o)){o.cx=+o.cx;o.cy=+o.cy;}else{delete o.cx;delete o.cy;}
  const st=lineStyle(o.type,o.color);
  const g=svgEl('g',{class:'draw-g'}); g.dataset.type=o.type; g.dataset.color=o.color;
  g.dataset.x1=o.x1;g.dataset.y1=o.y1;g.dataset.x2=o.x2;g.dataset.y2=o.y2;
  if(hasCurve(o)){g.dataset.cx=o.cx;g.dataset.cy=o.cy;}
  if(isZone(o.type)){ // zona: rettangolo o ovale inscritto tra i due angoli, bordo tratteggiato e fondo semitrasparente
    const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2),w=Math.abs(o.x2-o.x1),h=Math.abs(o.y2-o.y1);
    const shape=(extra)=>o.type==='zcerchio'?svgEl('ellipse',{cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2,...extra}):svgEl('rect',{x,y,width:w,height:h,rx:4,...extra});
    g.appendChild(shape({class:'vis','pointer-events':'none',fill:o.color,'fill-opacity':.18,stroke:o.color,'stroke-width':3,'stroke-dasharray':'10,7'}));
    g.appendChild(shape({class:'hit',fill:'none',stroke:'transparent','stroke-width':22,'pointer-events':'stroke'}));
    return g;
  }
  const base=basePathD(o);
  const d = st.wavy? wavyD(o) : base;
  const hit=svgEl('path',{d:base,class:'hit',fill:'none',stroke:'transparent','stroke-width':22,'pointer-events':'stroke','stroke-linecap':'round'});
  const vis=svgEl('path',{d,class:'vis',fill:'none',stroke:st.stroke,'stroke-width':st.width,'stroke-linecap':'round','stroke-linejoin':'round'});
  if(st.dash) vis.setAttribute('stroke-dasharray',st.dash);
  if(st.head) vis.setAttribute('marker-end','url(#arrow-'+cssId(o.color)+')');
  ensureMarker(o.color);
  g.appendChild(hit); g.appendChild(vis);
  return g;
}
function cssId(c){return (c||'#111').replace('#','');}
const markerDefs={};
function ensureMarker(color){
  const id='arrow-'+cssId(color);
  document.querySelectorAll('.field svg.draw defs').forEach(defs=>{
    if(defs.querySelector('#'+id)) return;
    const m=svgEl('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
    m.appendChild(svgEl('path',{d:'M0,0 L10,5 L0,10 z',fill:color}));
    defs.appendChild(m);
  });
}

/* ---- Creazione campo ---- */
const GRASS='<defs><linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#37a85a"/><stop offset="1" stop-color="#2b8f4b"/></linearGradient></defs>';
function pitchSVG(type){

      <g stroke="#fff" stroke-width="3" fill="none" opacity=".9">

  return {arw:1050,arh:680,
    svg:`<svg class="pitch" viewBox="0 0 ${VBW} ${VBH}" preserveAspectRatio="none">${GRASS}<rect x="0" y="0" width="${VBW}" height="${VBH}" fill="url(#grass)"/>
      <g stroke="#fff" stroke-width="3" fill="none" opacity=".9">
        <rect x="30" y="30" width="990" height="620"/><line x1="525" y1="30" x2="525" y2="650"/>
        <circle cx="525" cy="340" r="82"/><circle cx="525" cy="340" r="3" fill="#fff"/>
        <rect x="30" y="180" width="150" height="320"/><rect x="30" y="255" width="55" height="170"/>
        <rect x="870" y="180" width="150" height="320"/><rect x="965" y="255" width="55" height="170"/>
        <circle cx="140" cy="340" r="3" fill="#fff"/><circle cx="910" cy="340" r="3" fill="#fff"/>
      </g></svg>`};
}
function setPitch(field,type){
  field.dataset.pitch=type;
  const p=pitchSVG(type);
  field.style.setProperty('--arw',p.arw);field.style.setProperty('--arh',p.arh);
  const tmp=document.createElement('div');tmp.innerHTML=p.svg;const ns=tmp.firstElementChild;
  const cur=field.querySelector('svg.pitch');
  if(cur)field.replaceChild(ns,cur);else field.insertBefore(ns,field.firstChild);
}
function makeField(type){
  const field=document.createElement('div');field.className='field';
  const draw=svgEl('svg',{class:'draw',viewBox:`0 0 ${VBW} ${VBH}`,preserveAspectRatio:'none'});
  draw.appendChild(svgEl('defs',{}));
  const catch_=svgEl('rect',{class:'catch',x:0,y:0,width:VBW,height:VBH,fill:'transparent','pointer-events':(mode!=='select'&&mode!=='gomma')?'all':'none'});
  draw.appendChild(catch_);
  field.appendChild(draw);
  setPitch(field,type||'intero');
  wireField(field,draw);
  return field;

function pointToVB(field,cx,cy){const r=field.getBoundingClientRect();return{x:(cx-r.left)/r.width*VBW,y:(cy-r.top)/r.height*VBH,r};}

// crea un elemento nel campo dalla "chiave" della palette (immagine / forma / testo)
function addToField(field,key,xp,yp){
  setMode('select');
  if(key==='__text__') return addTextElement(field,xp,yp);
  if(key.slice(0,6)==='shape:'){const sk=parseShapeKey(key);return addShapeElement(field,sk.kind,xp,yp,sk.color?{color:sk.color}:{});}
  // giocatori con divisa: larghezza calcolata per avere la stessa altezza delle altre sagome
  const kk=parseKitKey(key);
  if(kk) return addImageElement(field,kk.file,xp,yp,{w:{'kit frontale.png':2.8,'kit spalle.png':2.8,'kit corsa.png':5.2,'kit corsa spalle.png':6.7}[kk.file],color:kk.color});
  return addImageElement(field,key,xp,yp);
}
// campo "attivo" per il tocco: quello più visibile nella finestra
function pickTargetField(){
  const fields=[...document.querySelectorAll('.exercise:not(.text-only) .field')];
  if(!fields.length) return null;
  const vh=window.innerHeight||document.documentElement.clientHeight;
  let best=fields[fields.length-1],bestVis=-1;
  fields.forEach(f=>{const r=f.getBoundingClientRect();
    const vis=Math.max(0,Math.min(r.bottom,vh)-Math.max(r.top,0));
    if(vis>bestVis){bestVis=vis;best=f;}});
  return best;
}
// tocca/clic su una tile della palette → aggiunge al centro del campo attivo
function tapAdd(key){
  const field=pickTargetField();if(!field)return;
  addToField(field,key,50,50);
  field.scrollIntoView({behavior:'smooth',block:'center'});
}

function wireField(field,draw){
  // drop dalla palette
  field.addEventListener('dragover',e=>e.preventDefault());
  field.addEventListener('drop',e=>{
    e.preventDefault();const f=e.dataTransfer.getData('text/plain');if(!f)return;
    const r=field.getBoundingClientRect();
    const xp=(e.clientX-r.left)/r.width*100, yp=(e.clientY-r.top)/r.height*100;
    addToField(field,f,xp,yp);
  });
  // disegno / gomma / selezione linee
  draw.addEventListener('pointerdown',e=>{
    // premuto su una freccia esistente: gomma = cancella, altrimenti seleziona e sposta (in qualsiasi modalità)
    if(e.target.classList.contains('hit')){
      const g=e.target.parentNode;
      e.preventDefault(); e.stopPropagation();
      if(mode==='gomma'){ if(g===selectedDraw) selectEl(null); g.remove(); return; }
      selectDraw(g);
      const s=pointToVB(field,e.clientX,e.clientY), c0=drawCoords(g);
      const move=ev=>{const p=pointToVB(field,ev.clientX,ev.clientY);const dx=p.x-s.x,dy=p.y-s.y;
        const c={...c0,x1:c0.x1+dx,y1:c0.y1+dy,x2:c0.x2+dx,y2:c0.y2+dy};
        if(hasCurve(c0)){c.cx=c0.cx+dx;c.cy=c0.cy+dy;}
        setDraw(selectedDraw,c);};
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
      return;
    }
    if(mode==='select'||mode==='gomma') return;
    // nuova freccia: trascina per disegnarla; un tocco singolo crea una freccia standard da regolare
    e.preventDefault(); selectEl(null);
    const s=pointToVB(field,e.clientX,e.clientY);
    const type=mode,color=colorInp.value;
    let g=buildDraw({type,color,x1:s.x,y1:s.y,x2:s.x,y2:s.y});
    draw.appendChild(g);
    const move=ev=>{const p=pointToVB(field,ev.clientX,ev.clientY);
      const ng=buildDraw({type,color,x1:s.x,y1:s.y,x2:p.x,y2:p.y});
      draw.replaceChild(ng,g); g=ng;};
    const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
      const p=pointToVB(field,ev.clientX,ev.clientY);
      if(Math.hypot(p.x-s.x,p.y-s.y)<8&&isZone(type)){ // tocco: zona standard centrata sul punto
        const w=type==='zcerchio'?140:200,h=140,cx=Math.min(VBW-w/2-5,Math.max(w/2+5,s.x)),cy=Math.min(VBH-h/2-5,Math.max(h/2+5,s.y));
        const ng=buildDraw({type,color,x1:cx-w/2,y1:cy-h/2,x2:cx+w/2,y2:cy+h/2}); draw.replaceChild(ng,g); g=ng;
      } else if(Math.hypot(p.x-s.x,p.y-s.y)<8){ // tocco: freccia standard verso destra (resta nel campo)
        const L=150, x2=Math.min(VBW-10,s.x+L), x1=Math.max(10,x2-L);
        const ng=buildDraw({type,color,x1,y1:s.y,x2,y2:s.y}); draw.replaceChild(ng,g); g=ng;
      }
      selectDraw(g); lineJustDrawn=true; // subito selezionata, con le maniglie per regolarla
      setMode('select',true); // lo strumento si disattiva: un clic sul campo non crea un'altra freccia
    };
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
  // deseleziona cliccando sul verde
  field.addEventListener('pointerdown',e=>{
    if(mode==='select' && (e.target.classList.contains('pitch')||e.target.classList.contains('draw')||e.target.classList.contains('catch')||e.target===field)) selectEl(null);
  });
}

function addImageElement(field,file,cxPct,cyPct,opt={}){

}
function addShapeElement(field,shape,cxPct,cyPct,opt={}){

  const img=document.createElement('img');img.src=shapeURI(shape,el.dataset.color,el.dataset.num);el.appendChild(img);
  applyT(el);
  field.appendChild(el);
  wireElement(el,field);
  // pedina: doppio clic per impostare/cambiare il numero
  if(shape==='pedina') el.addEventListener('dblclick',e=>{e.stopPropagation();editPedinaNum(el);});

}
function editPedinaNum(el){
  const v=prompt('Numero della pedina (0–99, vuoto = nessun numero):', el.dataset.num||'');
  if(v===null) return;
  el.dataset.num=String(v).replace(/[^0-9]/g,'').slice(0,2);

}
function recolorShape(el,color){el.dataset.color=color;el.querySelector('img').src=shapeURI(el.dataset.shape,color,el.dataset.num);}
function addTextElement(field,cxPct,cyPct,opt={}){
  const el=document.createElement('div');el.className='drop-el text';el.dataset.kind='text';
  el.dataset.rot=opt.rot||0;el.dataset.flip=opt.flip?1:0;
  const fs=opt.fs||4;el.dataset.fs=fs;el.dataset.color=opt.color||colorInp.value;
  el.style.left=cxPct+'%';el.style.top=cyPct+'%';el.style.transform='translate(-50%,-50%)';el.style.fontSize=fs+'cqw';
  const txt=document.createElement('div');txt.className='txt';txt.style.color=el.dataset.color;txt.textContent=opt.text||'';
  el.appendChild(txt);
  applyT(el);
  field.appendChild(el);
  wireElement(el,field);
  const enterEdit=()=>{txt.contentEditable=true;txt.focus();
    const rg=document.createRange();rg.selectNodeContents(txt);const s=getSelection();s.removeAllRanges();s.addRange(rg);};
  txt.addEventListener('dblclick',e=>{e.stopPropagation();enterEdit();});
  txt.addEventListener('blur',()=>{txt.contentEditable=false;if(!txt.textContent.trim()){el.remove();selectEl(null);}});
  txt.addEventListener('keydown',e=>e.stopPropagation());
  selectEl(el);
  if(!opt.text) enterEdit();   // nuova casella: entra subito in modifica
  return el;
}
function applyT(el){const r=el.dataset.rot||0,fl=el.dataset.flip==='1'?-1:1;
  const inner=el.querySelector('img')||el.querySelector('.txt');
  if(inner)inner.style.transform=`rotate(${r}deg) scaleX(${fl})`;}

function wireElement(el,field){
  const isText=el.dataset.kind==='text';
  el.addEventListener('pointerdown',e=>{
    if(isText && el.querySelector('.txt').isContentEditable)return; // in modifica: non trascinare
    e.preventDefault();e.stopPropagation();selectEl(el);
    const r=field.getBoundingClientRect();const sx=e.clientX,sy=e.clientY;
    const ol=parseFloat(el.style.left),ot=parseFloat(el.style.top);let moved=false;
    const move=ev=>{moved=true;let nl=ol+(ev.clientX-sx)/r.width*100,nt=ot+(ev.clientY-sy)/r.height*100;
      el.style.left=Math.max(0,Math.min(100,nl))+'%';el.style.top=Math.max(0,Math.min(100,nt))+'%';};
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
}

function selectEl(el){
  if(selectedDraw){selectedDraw.classList.remove('sel');selectedDraw=null;}
  removeLineHandles();floatEl.classList.remove('line-mode','zone-mode');lineJustDrawn=false;
  if(selectedEl)selectedEl.classList.remove('sel');
  selectedEl=el;
  if(el){el.classList.add('sel');floatEl.style.display='flex';
    if(el.dataset.color) colorInp.value=el.dataset.color;
  }else floatEl.style.display='none';
}
function selectDraw(g){
  selectEl(null);
  if(selectedDraw)selectedDraw.classList.remove('sel');
  selectedDraw=g; g.classList.add('sel');
  floatEl.style.display='flex';floatEl.classList.add('line-mode');floatEl.classList.toggle('zone-mode',isZone(g.dataset.type));
  if(g.dataset.color) colorInp.value=g.dataset.color;
  refreshHandles();markLineType();
}
// cambia il tipo della freccia (continua / tratteggiata / ondulata / tiro) mantenendo forma, curva e colore
function changeLineType(g,t){
  if(!g||!sameFamily(g.dataset.type,t)) return;
  const ng=buildDraw({type:t,color:g.dataset.color,...drawCoords(g)});
  ng.classList.add('sel');g.parentNode.replaceChild(ng,g);selectedDraw=ng;refreshHandles();markLineType();
}
function markLineType(){document.querySelectorAll('#floatEl .lt').forEach(b=>b.classList.toggle('on',!!selectedDraw&&b.dataset.t===selectedDraw.dataset.type));}
/* --- trasformazioni linee (toolbar e maniglie) --- */
function drawCoords(g){const c={x1:+g.dataset.x1,y1:+g.dataset.y1,x2:+g.dataset.x2,y2:+g.dataset.y2};
  if(g.dataset.cx!==undefined&&g.dataset.cx!==''){c.cx=+g.dataset.cx;c.cy=+g.dataset.cy;}return c;}
function setDraw(g,c,color){
  const ng=buildDraw({type:g.dataset.type,color:color||g.dataset.color,...c});
  ng.classList.add('sel');g.parentNode.replaceChild(ng,g);selectedDraw=ng;refreshHandles();return ng;
}
function rotateDraw(g,deg){const c=drawCoords(g),mx=(c.x1+c.x2)/2,my=(c.y1+c.y2)/2,a=deg*Math.PI/180;
  const R=(x,y)=>{const dx=x-mx,dy=y-my;return{x:mx+dx*Math.cos(a)-dy*Math.sin(a),y:my+dx*Math.sin(a)+dy*Math.cos(a)};};
  const p1=R(c.x1,c.y1),p2=R(c.x2,c.y2),n={x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y};
  if(hasCurve(c)){const q=R(c.cx,c.cy);n.cx=q.x;n.cy=q.y;}setDraw(g,n);}
function scaleDraw(g,f){const c=drawCoords(g),mx=(c.x1+c.x2)/2,my=(c.y1+c.y2)/2;
  const S=(x,y)=>({x:mx+(x-mx)*f,y:my+(y-my)*f});const p1=S(c.x1,c.y1),p2=S(c.x2,c.y2),n={x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y};
  if(hasCurve(c)){const q=S(c.cx,c.cy);n.cx=q.x;n.cy=q.y;}setDraw(g,n);}

/* --- maniglie della freccia selezionata: inizio (●), fine (●), curva (◆ al centro) --- */
let lineHandles=[];
function removeLineHandles(){lineHandles.forEach(h=>h.remove());lineHandles=[];}
function refreshHandles(){
  const g=selectedDraw;
  if(!g||!g.isConnected){removeLineHandles();return;}
  const field=g.closest('.field');
  if(!lineHandles.length||lineHandles[0].parentNode!==field){
    removeLineHandles();
    ['s','m','e'].forEach(k=>{
      const h=document.createElement('div');h.className='line-handle lh-'+k;
      h.title=k==='m'?'Trascina per curvare · doppio clic per raddrizzare':'Trascina per allungare, accorciare o orientare';
      h.addEventListener('pointerdown',ev=>startHandleDrag(ev,field,k));
      if(k==='m') h.addEventListener('dblclick',ev=>{ev.stopPropagation();ev.preventDefault();
        const cc=drawCoords(selectedDraw);delete cc.cx;delete cc.cy;setDraw(selectedDraw,cc);});
      field.appendChild(h);lineHandles.push(h);
    });
  }
  const c=drawCoords(g),mid=qPt(c,ctrlOf(c),0.5);
  const zone=isZone(g.dataset.type);lineHandles[1].style.display=zone?'none':'';
  lineHandles[0].title=lineHandles[2].title=zone?'Trascina per ridimensionare la zona':'Trascina per allungare, accorciare o orientare';
  const pos=[[c.x1,c.y1],[mid.x,mid.y],[c.x2,c.y2]];
  lineHandles.forEach((h,i)=>{h.style.left=(pos[i][0]/VBW*100)+'%';h.style.top=(pos[i][1]/VBH*100)+'%';});
}
function startHandleDrag(ev,field,k){
  ev.preventDefault();ev.stopPropagation();
  if(!selectedDraw) return;
  const c0=drawCoords(selectedDraw);
  const move=e=>{const p=pointToVB(field,e.clientX,e.clientY),c={...c0};
    if(k==='s'){c.x1=p.x;c.y1=p.y;if(hasCurve(c0)){c.cx=c0.cx+(p.x-c0.x1)/2;c.cy=c0.cy+(p.y-c0.y1)/2;}}
    else if(k==='e'){c.x2=p.x;c.y2=p.y;if(hasCurve(c0)){c.cx=c0.cx+(p.x-c0.x2)/2;c.cy=c0.cy+(p.y-c0.y2)/2;}}
    else{c.cx=2*p.x-(c0.x1+c0.x2)/2;c.cy=2*p.y-(c0.y1+c0.y2)/2;} // la curva passa sotto il dito
    setDraw(selectedDraw,c);};
  const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
}

floatEl.addEventListener('click',e=>{
  const btn=e.target.closest('button');const a=btn&&btn.dataset.a;if(!a)return;
  if(selectedDraw){const g=selectedDraw,c=drawCoords(g);
    if(a==='type'){changeLineType(g,btn.dataset.t);return;}
    if(a==='del'){g.remove();selectEl(null);return;}
    if(a==='rot+')rotateDraw(g,15);
    if(a==='rot-')rotateDraw(g,-15);
    if(a==='big')scaleDraw(g,1.15);
    if(a==='small')scaleDraw(g,0.85);
    if(a==='flip')setDraw(g,{...c,x1:c.x2,y1:c.y2,x2:c.x1,y2:c.y1}); // inverte il verso della freccia
    if(a==='front'){g.parentNode.appendChild(g);refreshHandles();}
    if(a==='dup'){const d={...c,x1:c.x1+24,y1:c.y1+24,x2:c.x2+24,y2:c.y2+24};
      if(hasCurve(c)){d.cx=c.cx+24;d.cy=c.cy+24;}
      const ng=buildDraw({type:g.dataset.type,color:g.dataset.color,...d});
      g.parentNode.appendChild(ng);selectDraw(ng);}
    return;
  }
  if(!selectedEl)return;const el=selectedEl;
  if(a==='del'){el.remove();selectEl(null);return;}
  if(a==='dup'){duplicateEl(el);return;}
  if(a==='rot+'){el.dataset.rot=(+el.dataset.rot||0)+15;applyT(el);}
  if(a==='rot-'){el.dataset.rot=(+el.dataset.rot||0)-15;applyT(el);}
  if(a==='flip'){el.dataset.flip=el.dataset.flip==='1'?0:1;applyT(el);}
  if(a==='front'){el.parentNode.appendChild(el);}
  if(a==='big'||a==='small'){const k=a==='big'?1.15:0.87;
    if(el.dataset.kind==='text'){let fs=Math.max(1.5,parseFloat(el.dataset.fs)*k);el.dataset.fs=fs;el.style.fontSize=fs+'cqw';}
    else{let w=parseFloat(el.style.width)*k;el.style.width=Math.max(2,w)+'%';}}
});
// duplica un oggetto mantenendone dimensione/rotazione/colore, leggermente spostato
function duplicateEl(el){
  const field=el.closest('.field'); if(!field) return;
  const x=Math.min(97,parseFloat(el.style.left)+3), y=Math.min(97,parseFloat(el.style.top)+3);
  const rot=+el.dataset.rot||0, flip=el.dataset.flip==='1';
  if(el.dataset.kind==='text')
    addTextElement(field,x,y,{fs:parseFloat(el.dataset.fs),color:el.dataset.color,rot,flip,text:el.querySelector('.txt').textContent});
  else if(el.dataset.kind==='shape')
    addShapeElement(field,el.dataset.shape,x,y,{w:parseFloat(el.style.width),color:el.dataset.color,num:el.dataset.num,rot,flip});
  else
    addImageElement(field,el.dataset.file,x,y,{w:parseFloat(el.style.width),rot,flip,color:el.dataset.color});
}
document.addEventListener('keydown',e=>{
  const t=document.activeElement.tagName;if(t==='INPUT'||t==='TEXTAREA'||document.activeElement.isContentEditable)return;
  if(e.key==='Delete'||e.key==='Backspace'){

  }
});

function makeExercise(data={}){

  function setTextOnly(on){ex.classList.toggle('text-only',on);ex.dataset.mode=on?'testo':'';
    notes.querySelector(':scope>label').textContent=on?'Descrizione esercizio':'Note';
    notes.querySelector('textarea').placeholder=on?'Svolgimento, regole, varianti, punti di attenzione...':'Descrizione, obiettivi, varianti, regole, punti di attenzione...';}
  pitchSel.addEventListener('change',()=>{selectEl(null);
    if(pitchSel.value==='testo'){setTextOnly(true);return;}
    setTextOnly(false);setPitch(field,pitchSel.value);});
  const notes=document.createElement('div');notes.className='notes';
  notes.innerHTML=`<div class="mat-row"><label class="mat-lbl">Materiale</label><input class="mat" placeholder="Es. 6 coni, 10 palloni, 2 porte piccole"></div><label>Note</label><textarea placeholder="Descrizione, obiettivi, varianti, regole, punti di attenzione..."></textarea><div class="notes-print"></div><div class="text-print"><div class="tp-meta"></div><div class="tp-txt"></div></div>`;
  body.appendChild(fbox);body.appendChild(notes);
  ex.appendChild(head);ex.appendChild(body);
  content.insertBefore(ex,addRow);

  head.querySelector('.title').value=data.title||'';
  head.querySelector('.dur').value=data.dur||'';
  notes.querySelector('textarea').value=data.notes||'';
  notes.querySelector('.mat').value=data.mat||'';
  if(data.mode==='testo'){pitchSel.value='testo';setTextOnly(true);}
  (data.els||[]).forEach(o=>{
    if(o.kind==='text') addTextElement(field,o.x,o.y,{fs:o.fs,rot:o.rot,flip:o.flip,color:o.color,text:o.text});
    else if(o.kind==='shape') addShapeElement(field,o.shape,o.x,o.y,{w:o.w,rot:o.rot,flip:o.flip,color:o.color,num:o.num});
    else if(IMG[o.file]) addImageElement(field,o.file,o.x,o.y,{w:o.w,rot:o.rot,flip:o.flip,color:o.color});
  });
  (data.draws||[]).forEach(o=>{const g=buildDraw(o);field.querySelector('svg.draw').appendChild(g);});
  selectEl(null);

  head.querySelector('.ex-btns').addEventListener('click',e=>{
    const a=e.target.dataset.a;if(!a)return;
    if(a==='toggle'){ if(ex.classList.contains('collapsed')) soloExpand(ex); else ex.classList.add('collapsed'); }
    if(a==='del'){if(confirm('Eliminare questa esercitazione?')){ex.remove();renumber();}}
    if(a==='up'){const p=ex.previousElementSibling;if(p&&p.classList.contains('exercise'))content.insertBefore(ex,p);renumber();}
    if(a==='down'){const n=ex.nextElementSibling;if(n&&n.classList.contains('exercise'))content.insertBefore(n,ex);renumber();}
    if(a==='dup'){const nx=makeExercise(readExercise(ex));soloExpand(nx);renumber();}
  });

}
// espande solo `ex`, comprimendo tutte le altre
function soloExpand(ex){
  content.querySelectorAll('.exercise').forEach(x=>x.classList.toggle('collapsed', x!==ex));
}
function renumber(){[...content.querySelectorAll('.exercise')].forEach((ex,i)=>ex.querySelector('.ex-badge').textContent=i+1);}

/* ---- Serializzazione ---- */
function readExercise(ex){
  const field=ex.querySelector('.field');
  const els=[...field.querySelectorAll('.drop-el')].map(el=>{
    const base={x:parseFloat(el.style.left),y:parseFloat(el.style.top),rot:+el.dataset.rot||0,flip:el.dataset.flip==='1'};
    if(el.dataset.kind==='text') return {...base,kind:'text',fs:+el.dataset.fs,color:el.dataset.color,text:el.querySelector('.txt').textContent};
    if(el.dataset.kind==='shape') return {...base,kind:'shape',shape:el.dataset.shape,color:el.dataset.color,num:el.dataset.num||'',w:parseFloat(el.style.width)};
    return {...base,kind:'img',file:el.dataset.file,w:parseFloat(el.style.width),...(el.dataset.color?{color:el.dataset.color}:{})};
  });
  const draws=[...field.querySelectorAll('.draw-g')].map(g=>({
    type:g.dataset.type,color:g.dataset.color,...drawCoords(g)}));
  return {title:ex.querySelector('.title').value,dur:ex.querySelector('.dur').value,pitch:field.dataset.pitch,
    notes:ex.querySelector('.notes textarea').value,mat:ex.querySelector('.mat').value,mode:ex.dataset.mode||'',els,draws};
}
const META=['f_data','f_cat','f_num','f_dur','f_obj','f_ngioc','f_mat'];
function collect(){
  const meta={};META.forEach(id=>meta[id]=document.getElementById(id).value);
  return {meta,exercises:[...content.querySelectorAll('.exercise')].map(readExercise),v:2};
}
function restore(data){
  if(!data)return;
  META.forEach(id=>{if(data.meta&&id in data.meta)document.getElementById(id).value=data.meta[id];});
  content.querySelectorAll('.exercise').forEach(n=>n.remove());
  (data.exercises||[]).forEach(x=>makeExercise(x));
  if(!(data.exercises&&data.exercises.length))makeExercise();
  const first=content.querySelector('.exercise');if(first&&content.querySelectorAll('.exercise').length>1)soloExpand(first);
  renumber();
}

let flashT;function flash(msg){const b=document.getElementById('btnSave');const o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent='✓ '+msg;clearTimeout(flashT);flashT=setTimeout(()=>b.textContent=o,1400);}
// Salva/Carica su file del dispositivo. Usa la finestra nativa dove disponibile
// (Chrome/Edge), con ricaduta su download / selezione file (Safari/Firefox).
let fileHandle=null;
function suggestedName(){
  const cat=(document.getElementById('f_cat').value||'seduta').trim();
  const num=(document.getElementById('f_num').value||'').trim();
  const dt=(document.getElementById('f_data').value||'').trim();
  return (cat + (num?('_seduta'+num):'') + (dt?('_'+dt):'')).replace(/[^\w\-]+/g,'_').replace(/_+/g,'_') + '.json';
}
async function doSave(){
  const data=JSON.stringify(collect(),null,2);
  const name=suggestedName();
  // salva comunque una copia locale (rete di sicurezza, es. se annulli la condivisione)
  try{localStorage.setItem('esercitazione_auto',data);}catch(e){}
  // 1) Chrome/Edge desktop: finestra di salvataggio nativa (o riscrive lo stesso file)
  if(fileHandle){
    try{const w=await fileHandle.createWritable();await w.write(data);await w.close();flash('Salvato');return;}
    catch(e){fileHandle=null;}
  }
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:'Seduta (JSON)',accept:{'application/json':['.json']}}]});
      const w=await h.createWritable();await w.write(data);await w.close();
      fileHandle=h;flash('Salvato');return;
    }catch(e){if(e && e.name==='AbortError')return;}
  }
  // 2) iPad/iPhone: foglio di condivisione (Salva su File, AirDrop, Mail…)
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      flash('Salvato'); return;
    }
  }catch(e){ if(e && e.name==='AbortError'){flash('Salvato in locale');return;} }
  // 3) desktop Safari/Firefox: download del file
  try{
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    flash('Scaricato'); return;
  }catch(e){}
  // 4) ultima spiaggia: apri i dati in una nuova scheda (l'utente li salva a mano)
  try{window.open('data:application/json;charset=utf-8,'+encodeURIComponent(data),'_blank');flash('Aperto');}catch(e){alert('Impossibile salvare su questo dispositivo.');}
}
function loadFromText(t){try{restore(JSON.parse(t));flash('Caricato');}catch(err){alert('File non valido');}}
async function doLoad(){
  // Chrome/Edge desktop: selettore file nativo con handle riutilizzabile per il Salva
  if(window.showOpenFilePicker){
    try{
      const [h]=await window.showOpenFilePicker({multiple:false,
        types:[{description:'Seduta (JSON)',accept:{'application/json':['.json']}}]});
      const f=await h.getFile();loadFromText(await f.text());fileHandle=h;return;
    }catch(e){if(e && e.name==='AbortError')return;}
  }
  // iPad/iPhone e altri: input file (dev'essere nel DOM per aprirsi su iOS)
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json,application/octet-stream';
  inp.style.position='fixed';inp.style.left='-9999px';inp.style.top='0';
  document.body.appendChild(inp);
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];
    if(f){const fr=new FileReader();fr.onload=()=>loadFromText(fr.result);fr.readAsText(f);}
    setTimeout(()=>inp.remove(),0);
  });
  inp.click();
}

document.getElementById('btnLoad').onclick=doLoad;

  function setLogo(u){if(u){img.src=u;ph.style.display='none';}else{img.removeAttribute('src');ph.style.display='';}}
  try{const l=localStorage.getItem('clubLogoData');if(l&&l.startsWith('data:image'))setLogo(l);}catch(_){}
  $('logoUpload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=ev=>{setLogo(ev.target.result);dd.classList.remove('open');
      try{localStorage.setItem('clubLogoData',ev.target.result);}catch(_){alert('Logo troppo grande per il salvataggio automatico: resta solo per questa sessione.');}};
    rd.readAsDataURL(f);e.target.value='';});
  $('removeLogoBtn').addEventListener('click',()=>{setLogo('');try{localStorage.removeItem('clubLogoData');}catch(_){}dd.classList.remove('open');});
  // firma allenatore: compare piccola in fondo a ogni pagina stampata
  const COACH_KEY='posizionamentiCoach';let coach='';
  try{coach=(localStorage.getItem(COACH_KEY)||'').trim();}catch(_){}
  function upd(){$('coachNameLbl').textContent=coach;$('coachBtn').textContent=coach?'Modifica nome':'Aggiungi nome allenatore';
    $('printSign').textContent=coach?('Allenatore: '+coach):'';}
  upd();
  $('coachBtn').addEventListener('click',()=>{dd.classList.remove('open');
    const v=prompt('Firma allenatore – nome e cognome (vuoto = nessuna firma):',coach);if(v===null)return;
    coach=v.replace(/\s+/g,' ').trim();
    try{coach?localStorage.setItem(COACH_KEY,coach):localStorage.removeItem(COACH_KEY);}catch(_){}upd();});
})();

/* ---- La palette sticky resta sotto la barra strumenti ---- */
function updateBarH(){
  const bar=document.querySelector('.drawbar');
  const h=(bar && getComputedStyle(bar).position==='sticky') ? bar.offsetHeight : 0;
  document.documentElement.style.setProperty('--barh', h+'px');
}
window.addEventListener('resize',updateBarH);

/* ---- Avvio ---- */
window.addEventListener('load',()=>{
  const d=localStorage.getItem('esercitazione_auto');
  if(d){try{restore(JSON.parse(d));}catch(e){makeExercise();}}
  else makeExercise();
  updateBarH();
});
</script>
