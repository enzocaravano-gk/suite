<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suite Allenatore</title>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --ink: #1b1b1b;
    --muted: #6b6b6b;
    --line: #e2ded6;
    --accent: #7a1f2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --card: #1f1f1f;
      --ink: #f1f1f1;
      --muted: #a0a0a0;
      --line: #2e2e2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 28px;
    margin: 0 auto 16px; overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; color: var(--muted); }

  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 820px;
  }
  .app {
    display: flex; flex-direction: column; gap: 14px;
    padding: 28px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-decoration: none; color: inherit;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .app:hover, .app:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 10px 28px rgba(0,0,0,.08);
    outline: none;
  }
  .icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    display: grid; place-items: center;
  }
  .icon svg { width: 28px; height: 28px; }
  .app h2 { margin: 0; font-size: 20px; }
  .app p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .go { margin-top: auto; font-weight: 600; color: var(--accent); font-size: 14px; }

  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <header>
    <div class="logo" id="logo">S</div>
    <h1>Suite Allenatore</h1>
    <p>Scegli lo strumento</p>
  </header>

  <main class="apps">
    <a class="app" href="lavagna/index.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M6.5 6.5l3 3M9.5 6.5l-3 3"/><circle cx="8" cy="16" r="1.9"/><path d="M12.5 8c3 0 4.5 2 4.5 6" stroke-dasharray="2 2.2"/><path d="M15 12.6l2 2 2-2"/></svg>
      </div>
      <h2>Lavagna</h2>
      <p>Crea le esercitazioni sul campo con giocatori, attrezzi e movimenti.</p>
      <span class="go">Apri →</span>
    </a>

    <a class="app" href="posizionamenti/index.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 4v16"/><circle cx="12" cy="12" r="3"/><circle cx="6" cy="9" r="1"/><circle cx="6" cy="15" r="1"/><circle cx="18" cy="12" r="1"/></svg>
      </div>
      <h2>Posizionamenti</h2>
      <p>Imposta formazioni e posizioni dei giocatori in campo.</p>
      <span class="go">Apri →</span>
    </a>

    <a class="app" href="report/index.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div>
      <h2>Report</h2>
      <p>Compila il report della gara ed esportalo in PDF.</p>
      <span class="go">Apri →</span>
    </a>
  </main>

  <footer>Suite Allenatore</footer>

<script>
  // Usa logo e colore del club già impostati in Report / Posizionamenti, se presenti
  try {
    const raw = localStorage.getItem('clubAccentColor');
    if (raw) {
      const v = JSON.parse(raw);
      const c = typeof v === 'string' ? v : (v && (v.accent || v.color));
      if (c) document.documentElement.style.setProperty('--accent', c);
    }
  } catch (e) {}
  try {
    const logo = localStorage.getItem('clubLogoData');
    if (logo && logo.startsWith('data:image')) {
      document.getElementById('logo').innerHTML = '<img alt="Logo club" src="' + logo + '">';
    }
  } catch (e) {}
</script>
</body>
</html>
